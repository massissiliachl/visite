<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Visit Béjaïa - Administration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/adminreservation.css">

</head>
<body>

    <div id="root"></div>

    <script>
        // ============================================================
        // ADMIN DASHBOARD — VERSION WEB
        // ============================================================
    
        // ---- API CONFIG ----
        const isLocalHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || !location.hostname;
        const API_BASE_URL = isLocalHost
            ? (location.port === '3000' ? `${window.location.origin}/api/reservations-admin` : 'http://127.0.0.1:3000/api/reservations-admin')
            : 'https://visitebejai.onrender.com/api/reservations-admin';
        const API_USERS_URL = isLocalHost
            ? (location.port === '3000' ? `${window.location.origin}/api/users` : 'http://127.0.0.1:3000/api/users')
            : 'https://visitebejai.onrender.com/api/users';
        const API_AUTH_URL = API_USERS_URL.replace('/api/users', '/api/auth');

        const BOAT_PRICE_BY_MINUTES = {
            30: 8000,
            60: 16000,
            90: 20000,
            120: 20000,
            150: 25000,
            180: 35000,
            210: 40000
        };

        function derivePaymentStatus(total, versement, reste) {
            const t = parseFloat(total) || 0;
            const v = parseFloat(versement) || 0;
            const r = reste != null ? (parseFloat(reste) || 0) : Math.max(0, t - v);
            if (t > 0 && (v >= t || r <= 0)) return 'paye';
            if (v > 0) return 'verse';
            return 'non_paye';
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function normalizeReservation(raw) {
            if (!raw) return raw;
            const total = parseFloat(raw.totalAPayer ?? raw.totalAPayer) || 0;
            const versement = parseFloat(raw.versement) || 0;
            const reste = raw.resteapayer != null || raw.resteAPayer != null
                ? (parseFloat(raw.resteapayer ?? raw.resteAPayer) || 0)
                : Math.max(0, total - versement);
            const note = (raw.note && String(raw.note).trim()) || 'Aucune note';
            return {
                ...raw,
                totalAPayer: total,
                versement,
                resteapayer: reste,
                note,
                createdById: raw.createdById || raw.created_by_id || null,
                createdByName: raw.createdByName || raw.created_by_name || null,
                paymentStatus: derivePaymentStatus(total, versement, reste)
            };
        }

        function formatTakenAt(d) {
            if (!d) return '';
            const x = new Date(d);
            if (isNaN(x)) return '';
            return x.toLocaleString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function takenByLine(r) {
            if (!r || !r.createdByName) return '';
            const when = formatTakenAt(r.createdAt);
            return `<p class="reservation-card__taken"><i class="fas fa-user-tie"></i>Prise par <strong>${escapeHtml(r.createdByName)}</strong>${when ? ` · ${escapeHtml(when)}` : ''}</p>`;
        }

        function suggestBoatTotal() {
            const minutes = parseInt(state.boatCircuit, 10);
            if (!BOAT_PRICE_BY_MINUTES[minutes]) return;
            if (!state.boatTotalAPayer || parseFloat(state.boatTotalAPayer) <= 0) {
                state.boatTotalAPayer = String(BOAT_PRICE_BY_MINUTES[minutes]);
                calculerResteBateau();
            }
        }
    
        // ---- ÉTAT GLOBAL ----
        const state = {
            isLoggedIn: false,
            loginError: '',
            loginLoading: false,
            userInfo: { id: null, nom: '', prenom: '', email: '', telephone: '', role: '' },
            loading: true,
            reservations: [],
            filteredReservations: [],
            reservationsLoading: false,
            refreshing: false,
            activeTab: 'today',
            searchDate: '',
            searchName: '',
            showDatePicker: false,
            nom: '', prenom: '', tel: '', personnes: '1', activite: 'Bateau', heure: '', date: '',
            showTimePicker: false,
            showDatePickerClient: false,
            totalAPayer: '', versement: '', resteAPayer: '0', note: '',
            boatNom: '', boatPrenom: '', boatTel: '', boatCircuit: '120', boatSlot: '09h-11h',
            boatNumber: '1', boatDate: '', showBoatDatePicker: false,
            boatTotalAPayer: '', boatVersement: '', boatResteAPayer: '0', boatNote: '',
            timeSlots: ['09h-11h', '11h-13h', '13h-15h', '15h-17h', '17h-19h'],
            newSlot: '',
            deleteMode: false,
            boatReservations: [],
            employeurs: [],
            employeursLoading: false,
            showCreateEmployeurModal: false,
            onlineEmployeurs: [],
            showOnlineOnly: false,
            newEmployeur: { nom: '', prenom: '', email: '', password: '', telephone: '', role: 'employeur' },
            modalVisible: false,
            profileModalVisible: false,
            notifModalVisible: false,
            detailModalVisible: false,
            selectedReservation: null,
            editProfileModalVisible: false,
            editProfile: { nom: '', prenom: '', telephone: '', email: '' },
            todaySelectedDate: new Date().toISOString().split('T')[0],
            showDatePickerToday: false,
            updatingFromInput: false,
            attributionStaff: 'all',
            attributionQ: ''
        };
    
        let rootEl = document.getElementById('root');
    
        // ---- FONCTIONS UTILES ----
        function formatDateFR(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
    
        function getTodayStr() {
            return new Date().toISOString().split('T')[0];
        }
    
        function timeToMinutes(timeStr) {
            if (!timeStr) return 0;
            const parts = timeStr.split(':');
            if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            const match = timeStr.match(/(\d+)h(\d+)/);
            if (match) return parseInt(match[1]) * 60 + parseInt(match[2]);
            return 0;
        }
    
        function formatLastActive(date) {
            if (!date) return 'Jamais';
            const now = new Date();
            const diff = now - new Date(date);
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);
            if (minutes < 1) return 'À l\'instant';
            if (minutes < 60) return `Il y a ${minutes} min`;
            if (hours < 24) return `Il y a ${hours} h`;
            return `Il y a ${days} j`;
        }
    
        function getPaymentStatusText(status) {
            switch(status) {
                case 'paye': return { text: 'Payé', color: '#4caf50', icon: 'fa-check-circle' };
                case 'verse': return { text: 'Acompte versé', color: '#ff9800', icon: 'fa-clock' };
                default: return { text: 'Non payé', color: '#f44336', icon: 'fa-times-circle' };
            }
        }
    
        function getActivityColor(activite) {
            const colors = {
                'Bateau': '#4caf50',
                'Visite guidée': '#2196f3',
                'Quad': '#ff9800',
                'Cheval': '#8bc34a',
                'Jetski': '#00bcd4',
                'Parapente': '#9c27b0',
                'Kayak': '#ff6f00',
                'Bouée tractée': '#e91e63'
            };
            return colors[activite] || '#757575';
        }
    
        // ---- STORAGE ----
        function storageGet(key) {
            try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
        }
        function storageSet(key, value) {
            localStorage.setItem(key, JSON.stringify(value));
        }
    
        // ---- API HELPERS ----
        async function apiFetch(url, options = {}) {
            const token = localStorage.getItem('token');
            const headers = {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
                ...options.headers,
            };
            const res = await fetch(url, { ...options, headers });
            const raw = await res.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch { data = {}; }
            if (!res.ok) throw new Error(data.message || data.error || `HTTP ${res.status}`);
            return data;
        }
    
        // ---- AUTHENTIFICATION ----
        async function handleLogin(e) {
            e.preventDefault();
            
            // Désactiver le bouton et afficher le chargement
            const loginBtn = document.querySelector('.login-btn');
            const errorEl = document.querySelector('.login-error');
            
            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion...';
            }
            
            if (errorEl) {
                errorEl.style.display = 'none';
                errorEl.textContent = '';
            }

            const identifier = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            // Validation des champs
            if (!identifier || !password) {
                state.loginError = 'Veuillez remplir tous les champs';
                if (errorEl) {
                    errorEl.textContent = state.loginError;
                    errorEl.style.display = 'block';
                }
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Se connecter';
                }
                render();
                return;
            }

            try {
                let data;
                try {
                    data = await apiFetch(`${API_AUTH_URL}/login`, {
                        method: 'POST',
                        body: JSON.stringify({ email: identifier, password })
                    });
                } catch (authErr) {
                    const adminRes = await fetch(`${API_BASE_URL.replace('/api/reservations-admin', '')}/api/admin/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: identifier, password })
                    });
                    const adminData = await adminRes.json().catch(() => ({}));
                    if (!adminRes.ok || !adminData.token) throw authErr;
                    data = {
                        token: adminData.token,
                        user: { id: null, nom: 'Admin', prenom: '', email: identifier, role: 'admin', telephone: '' }
                    };
                }

                if (!data.user) {
                    throw new Error('Identifiants incorrects');
                }

                if (data.user.role !== 'admin' && data.user.role !== 'employeur') {
                    throw new Error('Accès non autorisé. Vous devez être administrateur ou employeur.');
                }

                state.isLoggedIn = true;
                state.loginError = '';
                state.userInfo = data.user;

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Charger les données initiales
                await init();

                // Réinitialiser le formulaire
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Se connecter';
                }

            } catch (err) {
                console.error('Erreur de connexion:', err);
                state.loginError = err.message || 'Email ou nom d\'utilisateur incorrect';
                
                if (errorEl) {
                    errorEl.textContent = state.loginError;
                    errorEl.style.display = 'block';
                }
                
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Se connecter';
                }
                render();
            }
        }

        function handleLogout() {
            if (!confirm('Voulez-vous vraiment vous déconnecter ?')) return;
            
            const token = localStorage.getItem('token');
            if (token) {
                fetch(`${API_AUTH_URL}/logout`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                }).catch(() => {});
            }
            
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            state.isLoggedIn = false;
            state.userInfo = { id: null, nom: '', prenom: '', email: '', telephone: '', role: '' };
            state.reservations = [];
            state.filteredReservations = [];
            state.boatReservations = [];
            render();
        }
    
        // ---- CHARGEMENT INITIAL ----
        async function init() {
            const token = localStorage.getItem('token');
            const userStr = localStorage.getItem('user');

            if (token && userStr) {
                state.isLoggedIn = true;
                try {
                    state.userInfo = JSON.parse(userStr);
                    await loadInitialData();
                } catch (e) {
                    console.error('Erreur chargement:', e);
                    state.isLoggedIn = false;
                }
            } else {
                state.isLoggedIn = false;
            }

            state.loading = false;
            render();
        }
    
        async function loadInitialData() {
            await Promise.all([
                loadSlots(),
                loadReservations(),
                loadEmployeurs()
            ]);
        }
    
        async function loadSlots() {
            try {
                const saved = localStorage.getItem('timeSlots');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    state.timeSlots = parsed;
                    if (parsed.length > 0 && !state.boatSlot) state.boatSlot = parsed[0];
                } else {
                    const defaultSlots = ['09h-11h', '11h-13h', '13h-15h', '15h-17h', '17h-19h'];
                    state.timeSlots = defaultSlots;
                    state.boatSlot = defaultSlots[0];
                    localStorage.setItem('timeSlots', JSON.stringify(defaultSlots));
                }
            } catch (e) { console.error('Erreur chargement créneaux:', e); }
        }
    
        async function loadReservations() {
            state.reservationsLoading = true;
            try {
                const data = await apiFetch(API_BASE_URL);
                state.reservations = data.map(normalizeReservation);
                state.filteredReservations = state.reservations;
                state.boatReservations = state.reservations.filter(r => r.activite === 'Bateau');
            } catch (e) {
                console.error('Erreur chargement réservations:', e);
                const local = localStorage.getItem('reservationsData');
                const data = local ? JSON.parse(local) : [];
                state.reservations = data;
                state.filteredReservations = data;
                state.boatReservations = data.filter(r => r.activite === 'Bateau');
            }
            state.reservationsLoading = false;
            render();
        }
    
        async function loadEmployeurs() {
            state.employeursLoading = true;
            try {
                let data;
                try {
                    data = await apiFetch(`${API_USERS_URL}/employeurs`);
                } catch {
                    data = await apiFetch(`${API_AUTH_URL}/employeurs`);
                }
                state.employeurs = data;
                const onlineStatus = data.map(emp => {
                    const lastSeen = emp.lastSeen ? new Date(emp.lastSeen) : null;
                    const isOnlineByLastSeen = lastSeen ? (Date.now() - lastSeen.getTime()) < 5 * 60 * 1000 : false;
                    const isOnline = Boolean(emp.isOnline) && isOnlineByLastSeen;
                    return {
                        ...emp,
                        isOnline,
                        disconnectedFor: isOnline ? null : formatLastActive(lastSeen),
                        lastActiveStr: formatLastActive(lastSeen)
                    };
                });
                state.onlineEmployeurs = onlineStatus;
            } catch (e) {
                console.error('Erreur chargement employeurs:', e);
                state.employeurs = [];
                state.onlineEmployeurs = [];
            }
            state.employeursLoading = false;
            render();
        }
    
        function saveSlots(slots) {
            localStorage.setItem('timeSlots', JSON.stringify(slots));
            state.timeSlots = slots;
            if (slots.length > 0 && !slots.includes(state.boatSlot)) {
                state.boatSlot = slots[0];
            }
            render();
        }
    
        // ---- RECHERCHE ----
        function searchReservations() {
            let filtered = [...state.reservations];
            if (state.searchDate) {
                filtered = filtered.filter(r => r.date === state.searchDate);
            }
            if (state.searchName) {
                const q = state.searchName.toLowerCase();
                filtered = filtered.filter(r =>
                    (r.nom && r.nom.toLowerCase().includes(q)) ||
                    (r.prenom && r.prenom.toLowerCase().includes(q))
                );
            }
            state.filteredReservations = filtered;
            render();
        }
    
        function clearSearch() {
            state.searchDate = '';
            state.searchName = '';
            state.filteredReservations = state.reservations;
            render();
        }
    
        // ---- CALCULS PAIEMENT ----
        function updatePaymentStatusPreview(total, versement, elementId) {
            const el = document.getElementById(elementId);
            if (!el) return;
            const status = derivePaymentStatus(total, versement);
            const info = getPaymentStatusText(status);
            el.innerHTML = `<span class="payment-badge" style="background:${info.color}"><i class="fas ${info.icon}"></i> ${info.text}</span>`;
        }

        function calculerReste() {
            const total = parseFloat(state.totalAPayer) || 0;
            const vers = parseFloat(state.versement) || 0;
            state.resteAPayer = Math.max(0, total - vers).toString();
            const resteInput = document.getElementById('reste-client');
            if (resteInput) resteInput.value = state.resteAPayer;
            updatePaymentStatusPreview(total, vers, 'status-client');
        }

        function calculerResteBateau() {
            const total = parseFloat(state.boatTotalAPayer) || 0;
            const vers = parseFloat(state.boatVersement) || 0;
            state.boatResteAPayer = Math.max(0, total - vers).toString();
            const resteInput = document.getElementById('reste-bateau');
            if (resteInput) resteInput.value = state.boatResteAPayer;
            updatePaymentStatusPreview(total, vers, 'status-bateau');
        }
    
        // ---- GESTION DES INPUTS SANS RE-RENDU ----
        function updateStateFromInput(field, value) {
            state[field] = value;
            if (field === 'totalAPayer' || field === 'versement') {
                calculerReste();
            } else if (field === 'boatTotalAPayer' || field === 'boatVersement') {
                calculerResteBateau();
            }
        }
    
        // ---- AJOUT RÉSERVATION CLIENT ----
        async function addReservation() {
            if (!state.nom || !state.prenom) {
                alert('Veuillez remplir le nom et prénom');
                return;
            }
            if (!state.date) {
                alert('Veuillez sélectionner une date');
                return;
            }
            if (!state.heure) {
                alert('Veuillez sélectionner une heure');
                return;
            }

            const total = parseFloat(state.totalAPayer) || 0;
            if (total <= 0) {
                alert('Veuillez saisir un total > 0 DA');
                return;
            }
            const vers = parseFloat(state.versement) || 0;
            if (vers > total) {
                alert('Le versement ne peut pas dépasser le total');
                return;
            }

            const reste = Math.max(0, total - vers);
            const note = state.note.trim() || 'Aucune note';

            const newRes = {
                nom: state.nom,
                prenom: state.prenom,
                tel: state.tel || "",
                activite: state.activite,
                heure: state.heure,
                date: state.date,
                personnes: parseInt(state.personnes) || 1,
                totalAPayer: total,
                versement: vers,
                resteapayer: reste,
                note: note,
                slot: state.slot || null,
                subslot: state.subslot || null,
                bateau: state.bateau || null,
                duree: state.duree || null
            };

            console.log("📤 ENVOI API:", JSON.stringify(newRes, null, 2));

            try {
                const saved = normalizeReservation(await apiFetch(API_BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(newRes)
                }));

                console.log("✅ REPONSE BACKEND:", saved);

                state.reservations = [...state.reservations, saved];
                state.filteredReservations = state.reservations;
                state.boatReservations = state.reservations.filter(r => r.activite === 'Bateau');
                localStorage.setItem('reservationsData', JSON.stringify(state.reservations));

                alert(`✅ Réservation ajoutée\nTotal: ${saved.totalAPayer || total} DA\nVersé: ${saved.versement || vers} DA\nReste: ${saved.resteapayer || reste} DA\nStatut: ${getPaymentStatusText(saved.paymentStatus).text}`);
                resetClientForm();
            } catch (err) {
                console.error('❌ Erreur API:', err);
                alert('❌ Impossible d\'enregistrer dans la base de données');
            }
        }
    
        function resetClientForm() {
            state.nom = '';
            state.prenom = '';
            state.tel = '';
            state.personnes = '1';
            state.heure = '';
            state.date = '';
            state.totalAPayer = '';
            state.versement = '';
            state.resteAPayer = '0';
            state.note = '';
            state.modalVisible = false;
            render();
        }
    
        // ---- AJOUT RÉSERVATION BATEAU ----
        function getBookedBoatsForSlot(date, slot) {
            return new Set(
                state.boatReservations
                    .filter(r => r.date === date && r.slot === slot && r.activite === 'Bateau')
                    .map(r => String(r.bateau || '').replace('Bateau ', '').trim())
            );
        }

        function isSlotFullyBooked(date, slot) {
            return getBookedBoatsForSlot(date, slot).size >= 2;
        }

        function isBoatAlreadyBooked(date, slot, boatNum) {
            return getBookedBoatsForSlot(date, slot).has(String(boatNum));
        }
    
        async function addBoatReservation() {
            if (!state.boatNom || !state.boatPrenom) {
                alert('Veuillez remplir nom et prénom');
                return;
            }
            if (!state.boatTel) {
                alert('Veuillez entrer un téléphone');
                return;
            }
            if (!state.boatDate) {
                alert('Veuillez sélectionner une date');
                return;
            }
            if (!state.boatSlot) {
                alert('Veuillez sélectionner un créneau');
                return;
            }

            const total = parseFloat(state.boatTotalAPayer) || 0;
            if (total <= 0) {
                alert('Veuillez saisir un total > 0 DA');
                return;
            }
            const vers = parseFloat(state.boatVersement) || 0;
            if (vers > total) {
                alert('Le versement ne peut pas dépasser le total');
                return;
            }

            const reste = Math.max(0, total - vers);
            const note = state.boatNote.trim() || 'Aucune note';
            const boatNum = state.boatNumber;
            const selectedSlot = state.boatSlot;

            if (isSlotFullyBooked(state.boatDate, selectedSlot)) {
                alert('❌ Ce créneau est complet (2 bateaux réservés)');
                return;
            }
            if (isBoatAlreadyBooked(state.boatDate, selectedSlot, boatNum)) {
                alert(`❌ Le bateau ${boatNum} est déjà réservé sur ce créneau`);
                return;
            }

            const res = {
                nom: state.boatNom,
                prenom: state.boatPrenom,
                tel: state.boatTel,
                activite: 'Bateau',
                heure: selectedSlot,
                date: state.boatDate,
                personnes: 1,
                slot: selectedSlot,
                bateau: `Bateau ${boatNum}`,
                duree: state.boatCircuit + ' min',
                totalAPayer: total,
                versement: vers,
                resteapayer: reste,
                note: note
            };

            try {
                const saved = normalizeReservation(await apiFetch(API_BASE_URL, {
                    method: 'POST',
                    body: JSON.stringify(res)
                }));

                state.reservations = [...state.reservations, saved];
                state.filteredReservations = state.reservations;
                state.boatReservations = state.reservations.filter(r => r.activite === 'Bateau');
                localStorage.setItem('reservationsData', JSON.stringify(state.reservations));

                const statusText = getPaymentStatusText(saved.paymentStatus).text;
                alert(`✅ Réservation confirmée !\nBateau ${boatNum} - ${selectedSlot}\nTotal: ${total} DA\nVersé: ${vers} DA\nReste: ${reste} DA\nStatut: ${statusText}`);
                resetBoatForm();
            } catch (err) {
                console.error('❌ Erreur API bateau:', err);
                alert('❌ Erreur lors de la sauvegarde');
            }
        }
    
        function resetBoatForm() {
            state.boatNom = '';
            state.boatPrenom = '';
            state.boatTel = '';
            state.boatDate = '';
            state.boatTotalAPayer = '';
            state.boatVersement = '';

            }

            const updated = state.timeSlots.filter(s => s !== slot);
            saveSlots(updated);
            if (state.boatSlot === slot && updated.length > 0) state.boatSlot = updated[0];
            render();

        async function reassignReservation(id, selectEl) {
            const res = state.reservations.find(r => r.id === id);
            if (!res || !selectEl) return;
            const opt = selectEl.selectedOptions[0];
            const createdById = selectEl.value ? parseInt(selectEl.value, 10) || null : null;
            const createdByName = createdById
                ? (opt?.dataset.name || opt?.textContent || null)
                : null;
            try {
                const updated = await apiFetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    body: JSON.stringify({
                        nom: res.nom,
                        prenom: res.prenom,
                        tel: res.tel,
                        activite: res.activite,
                        heure: res.heure,
                        date: res.date,
                        personnes: res.personnes,
                        slot: res.slot || null,
                        subslot: res.subslot || null,
                        bateau: res.bateau || null,
                        duree: res.duree || null,
                        totalAPayer: res.totalAPayer,
                        versement: res.versement,
                        resteapayer: res.resteapayer,
                        note: res.note,
                        createdById,
                        createdByName
                    })
                });
                const normalized = normalizeReservation(updated);
                state.reservations = state.reservations.map(r => r.id === id ? normalized : r);
                state.filteredReservations = state.reservations;
                state.boatReservations = state.reservations.filter(r => r.activite === 'Bateau');
                state.selectedReservation = normalized;
                render();
            } catch (e) {
                alert('Erreur lors de la réattribution');
                selectEl.value = res.createdById || '';
            }
        }

        // ---- MISE À JOUR STATUT PAIEMENT ----
        async function updatePaymentStatus(id, status, amount) {
            const res = state.reservations.find(r => r.id === id);
            if (!res) return;

            const total = parseFloat(res.totalAPayer) || 0;
            if (status === 'verse') {
                res.versement = Math.min(parseFloat(amount) || 0, total);
            } else if (status === 'paye') {
                res.versement = total;
            } else {
                res.versement = 0;
            }
            res.resteapayer = Math.max(0, total - res.versement);
            const normalized = normalizeReservation(res);

            const updatedReservations = state.reservations.map(r => r.id === id ? normalized : r);
            state.reservations = updatedReservations;
            state.filteredReservations = updatedReservations;
            state.boatReservations = updatedReservations.filter(r => r.activite === 'Bateau');
            localStorage.setItem('reservationsData', JSON.stringify(updatedReservations));
            if (state.selectedReservation && state.selectedReservation.id === id) {
                state.selectedReservation = normalized;
            }
            render();

            try {
                const payload = {
                    nom: normalized.nom,
                    prenom: normalized.prenom,
                    tel: normalized.tel,
                    activite: normalized.activite,
                    heure: normalized.heure,
                    date: normalized.date,
                    personnes: normalized.personnes,
                    slot: normalized.slot || null,
                    subslot: normalized.subslot || null,
                    bateau: normalized.bateau || null,
                    duree: normalized.duree || null,
                    totalAPayer: normalized.totalAPayer,
                    versement: normalized.versement,
                    resteapayer: normalized.resteapayer,
                    note: normalized.note
                };
                
                console.log("📤 Mise à jour paiement:", JSON.stringify(payload, null, 2));
                
                await apiFetch(`${API_BASE_URL}/${id}`, { 
                    method: 'PUT', 
                    body: JSON.stringify(payload) 
                });
            } catch (e) {
                console.error('Erreur mise à jour paiement:', e);
            }
        }

        // ---- ATTACHER LES ÉVÉNEMENTS APRÈS RENDU ----
        function attachEvents() {
            const searchInput = document.getElementById('search-name-input');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    state.searchName = this.value;
                    const filtered = state.reservations.filter(r => {
                        const q = state.searchName.toLowerCase();
                        return (r.nom && r.nom.toLowerCase().includes(q)) ||
                               (r.prenom && r.prenom.toLowerCase().includes(q));
                    });
                    state.filteredReservations = filtered;
                    updateReservationsList();
                });
            }

            const attrSearch = document.getElementById('attr-search');
            if (attrSearch) {
                attrSearch.addEventListener('input', function () {
                    state.attributionQ = this.value;
                    // re-render would lose focus — soft update via debounce-free partial is harder here
                    clearTimeout(attrSearch._t);
                    attrSearch._t = setTimeout(() => render(), 280);
                });
            }
    
            const clientInputs = document.querySelectorAll('.client-input');
            clientInputs.forEach(input => {
                const handler = function() {
                    const field = this.dataset.field;
                    if (field) {
                        state[field] = this.value;
                        if (field === 'totalAPayer' || field === 'versement') {
                            calculerReste();
                        }
                    }
                };
                input.addEventListener('input', handler);
                if (input.tagName === 'TEXTAREA') input.addEventListener('change', handler);
            });
    
            const boatInputs = document.querySelectorAll('.boat-input');
            boatInputs.forEach(input => {
                const handler = function() {
                    const field = this.dataset.field;
                    if (field) {
                        state[field] = this.value;
                        if (field === 'boatTotalAPayer' || field === 'boatVersement') {
                            calculerResteBateau();
                        }
                    }
                };
                input.addEventListener('input', handler);
                if (input.tagName === 'TEXTAREA') input.addEventListener('change', handler);
            });
    
            document.querySelectorAll('.date-picker-native').forEach(el => {
                el.addEventListener('change', function(e) {
                    const val = e.target.value;
                    const action = this.dataset.action;
                    if (action === 'today') {
                        state.todaySelectedDate = val;
                        render();
                    } else if (action === 'search') {
                        state.searchDate = val;
                        render();
                    } else if (action === 'client') {
                        state.date = val;
                    } else if (action === 'boat') {
                        state.boatDate = val;
                        render();
                    }
                });
            });
    
            document.querySelectorAll('.time-picker-native').forEach(el => {
                el.addEventListener('change', function(e) {
                    const val = e.target.value;
                    if (this.dataset.action === 'client') {
                        state.heure = val;
                    }
                });
            });

            suggestBoatTotal();
            calculerResteBateau();
            const totalC = parseFloat(state.totalAPayer) || 0;
            const versC = parseFloat(state.versement) || 0;
            updatePaymentStatusPreview(totalC, versC, 'status-client');
            const totalB = parseFloat(state.boatTotalAPayer) || 0;
            const versB = parseFloat(state.boatVersement) || 0;
            updatePaymentStatusPreview(totalB, versB, 'status-bateau');
        }

        function renderBoat() {

                const isSelected = state.boatSlot === slot;
                let cls = 'slot-item';
                if (!isAvailable && boatDate) cls += ' unavailable';
                else if (isSelected) cls += ' selected';
                else if (boatDate) cls += ' available';
                else cls += '';
    
                let statusText = '';
                if (!boatDate) statusText = '<span class="status">Choisir date</span>';
                else if (!isAvailable) statusText = '<span class="status occupied">Complet</span>';
                else if (isSelected) statusText = '<span class="status selected">Sélectionné</span>';
                else statusText = '<span class="status free">Libre</span>';

                const onclick = boatDate
                    ? (isAvailable
                        ? `state.boatSlot='${slot}'; render();`
                        : `alert('Ce créneau est complet pour les 2 bateaux')`)
                    : `alert('Veuillez d\\'abord sélectionner une date')`;
    
                if (!boatDate) cls += ' pending-date';
                return `

                        ${statusText}

        function attributionStaffKey(r) {
            if (r.createdById) return String(r.createdById);
            if (r.createdByName) return `name:${r.createdByName}`;
            return 'none';
        }

        function renderAttributions() {
            const rows = state.reservations;
            const counts = { all: rows.length, none: 0 };
            const labels = { none: 'Sans attribution' };
            rows.forEach((r) => {
                const k = attributionStaffKey(r);
                if (k === 'none') counts.none++;
                else {
                    counts[k] = (counts[k] || 0) + 1;
                    labels[k] = r.createdByName || `Staff #${k}`;
                }
            });
            state.employeurs.forEach((e) => {
                const id = String(e.id);
                if (!labels[id]) labels[id] = `${e.prenom || ''} ${e.nom || ''}`.trim() || e.email;
                if (counts[id] == null) counts[id] = 0;
            });

            const attributed = rows.filter((r) => r.createdByName || r.createdById).length;
            const staffActive = Object.keys(counts).filter((k) => k !== 'all' && k !== 'none' && counts[k] > 0).length;

            const staffTabs = [
                { id: 'all', label: 'Tous', n: counts.all },
                { id: 'none', label: 'Sans attribution', n: counts.none },
                ...Object.keys(counts)
                    .filter((k) => k !== 'all' && k !== 'none' && counts[k] > 0)
                    .sort((a, b) => counts[b] - counts[a] || (labels[a] || '').localeCompare(labels[b] || '', 'fr'))
                    .map((id) => ({ id, label: labels[id], n: counts[id] }))
            ];

            const q = (state.attributionQ || '').toLowerCase().trim();
            const filtered = rows.filter((r) => {
                if (state.attributionStaff === 'none') {
                    if (r.createdById || r.createdByName) return false;
                } else if (state.attributionStaff !== 'all' && attributionStaffKey(r) !== state.attributionStaff) {
                    return false;
                }
                if (!q) return true;
                return [r.nom, r.prenom, r.tel, r.activite, r.createdByName, r.id, r.date]
                    .join(' ')
                    .toLowerCase()
                    .includes(q);
            }).sort((a, b) => `${b.date || ''} ${b.heure || ''}`.localeCompare(`${a.date || ''} ${a.heure || ''}`));

            return `
                <div class="attr-intro card">
                    <div class="card-title">Qui a pris chaque réservation</div>
                    <p>Chaque prise sur cette page enregistre l’employeur. Filtrez par personne ou réattribuez depuis le détail.</p>
                </div>
                <div class="attr-stats">
                    <div class="stat-pill"><strong>${rows.length}</strong><span>Total</span></div>
                    <div class="stat-pill"><strong>${attributed}</strong><span>Attribuées</span></div>
                    <div class="stat-pill"><strong>${counts.none}</strong><span>Sans nom</span></div>
                    <div class="stat-pill"><strong>${staffActive}</strong><span>Employeurs</span></div>
                </div>
                <div class="attr-tabs">
                    ${staffTabs.map((t) => `
                        <button type="button" class="${state.attributionStaff === t.id ? 'is-active' : ''}"
                            onclick="state.attributionStaff='${String(t.id).replace(/'/g, "\\'")}'; render();">
                            ${escapeHtml(t.label)} <em>${t.n}</em>
                        </button>
                    `).join('')}
                </div>
                <div class="card search-card">
                    <div class="search-bar">
                        <input type="search" id="attr-search" placeholder="Client, activité, employeur…" value="${escapeHtml(state.attributionQ)}" />
                    </div>
                    <p class="search-count">${filtered.length} réservation(s)</p>
                </div>
                <div class="resa-list-wrap">
                    ${filtered.map((r, i) => renderReservationCard(r, i)).join('') || `
                        <div class="empty-state"><h3>Aucune réservation pour ce filtre</h3></div>
                    `}
                </div>
            `;
        }

                                <div class="detail-row"><i class="fas fa-tag"></i><span class="label">Activité</span><span class="value"><span class="activity-badge" style="background:${getActivityColor(r.activite)}">${escapeHtml(r.activite)}</span></span></div>
                                ${r.bateau ? `<div class="detail-row"><i class="fas fa-ship"></i><span class="label">Bateau</span><span class="value">${escapeHtml(r.bateau)}</span></div>` : ''}
                                ${r.duree ? `<div class="detail-row"><i class="fas fa-hourglass"></i><span class="label">Durée</span><span class="value">${escapeHtml(r.duree)}</span></div>` : ''}
                            </div>
    
                            <div class="detail-section">
                                <h4>Paiement</h4>
                                <div class="detail-row"><i class="fas fa-money-bill"></i><span class="label">Total</span><span class="value">${r.totalAPayer || 0} DA</span></div>
                                <div class="detail-row"><i class="fas fa-credit-card"></i><span class="label">Versement</span><span class="value">${r.versement || 0} DA</span></div>
                                <div class="detail-row"><i class="fas fa-arrow-down"></i><span class="label">Reste</span><span class="value ${(r.resteapayer || 0) > 0 ? 'reste-positive' : 'reste-zero'}">${r.resteapayer || 0} DA</span></div>
                                <div class="detail-row"><i class="fas fa-check-circle"></i><span class="label">Statut</span><span class="value"><span class="payment-badge" style="background:${payment.color}"><i class="fas ${payment.icon}"></i> ${payment.text}</span></span></div>

                                <div class="payment-actions">
                                    <button class="btn-non-paye" onclick="updatePaymentStatus(${r.id},'non_paye',0); state.detailModalVisible=false; render();">Non payé</button>
                                    <button class="btn-verse" onclick="const amt=prompt('Montant de l\\'acompte (DA):'); if(amt!==null && !isNaN(amt)){updatePaymentStatus(${r.id},'verse',parseInt(amt)); state.detailModalVisible=false; render();}">Acompte</button>
                                    <button class="btn-paye" onclick="updatePaymentStatus(${r.id},'paye',0); state.detailModalVisible=false; render();">Payé</button>
                                </div>
                            </div>

                            <div class="detail-section">
                                <h4>Prise en charge</h4>
                                <div class="detail-row"><i class="fas fa-user-tie"></i><span class="label">Prise par</span><span class="value">${r.createdByName ? escapeHtml(r.createdByName) : 'Non renseigné'}</span></div>
                                <div class="detail-row"><i class="fas fa-clock"></i><span class="label">Quand</span><span class="value">${formatTakenAt(r.createdAt) || '—'}</span></div>
                                ${state.userInfo?.role === 'admin' ? `
                                <div class="form-group form-group--note">
                                    <label>Réattribuer</label>
                                    <select class="attr-assign" onchange="reassignReservation(${r.id}, this)">
                                        <option value="">— Non attribué —</option>
                                        ${state.employeurs.map(e => {
                                            const label = `${e.prenom || ''} ${e.nom || ''}`.trim() || e.email;
                                            const sel = String(e.id) === String(r.createdById) ? ' selected' : '';
                                            return `<option value="${e.id}" data-name="${escapeHtml(label)}"${sel}>${escapeHtml(label)}</option>`;
                                        }).join('')}
                                    </select>
                                </div>` : ''}
                            </div>

                            <div class="detail-section">
                                <h4>Note</h4>
                                <div class="detail-row"><i class="fas fa-sticky-note"></i><span class="label">Remarque:</span><span class="value">${escapeHtml(r.note || 'Aucune note')}</span></div>
                            </div>
    
                            <button class="btn-delete-detail" onclick="state.detailModalVisible=false; deleteReservation(${r.id});">
                                <i class="fas fa-trash"></i> Supprimer la réservation
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
    
        function renderCreateEmployeurModal() {
            const emp = state.newEmployeur;
            return `
                <div class="modal-overlay" onclick="if(event.target===this){state.showCreateEmployeurModal=false; render();}">
                    <div class="modal">
                        <div class="modal-header modal-header--success">
                            <h2>Nouvel employeur</h2>
                            <button class="close-btn" onclick="state.showCreateEmployeurModal=false; render();"><i class="fas fa-times"></i></button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label>Nom *</label>
                                <input type="text" placeholder="Nom" value="${emp.nom}" oninput="state.newEmployeur.nom=this.value; render();" />
                            </div>
                            <div class="form-group">
                                <label>Prénom *</label>
                                <input type="text" placeholder="Prénom" value="${emp.prenom}" oninput="state.newEmployeur.prenom=this.value; render();" />
                            </div>
                            <div class="form-group">
                                <label>Email *</label>
                                <input type="email" placeholder="Email" value="${emp.email}" oninput="state.newEmployeur.email=this.value; render();" />
                            </div>
                            <div class="form-group">
                                <label>Mot de passe * (min 6 caractères)</label>
                                <input type="password" placeholder="Mot de passe" value="${emp.password}" oninput="state.newEmployeur.password=this.value; render();" />
                            </div>
                            <div class="form-group">
                                <label>Téléphone</label>
                                <input type="tel" placeholder="Téléphone" value="${emp.telephone}" oninput="state.newEmployeur.telephone=this.value; render();" />
                            </div>
                            <div class="form-group">
                                <label>Rôle</label>
                                <div class="chip-group">
                                    <div class="chip ${emp.role === 'employeur' ? 'active' : ''}" onclick="state.newEmployeur.role='employeur'; render();">Employeur</div>
                                    <div class="chip ${emp.role === 'admin' ? 'active' : ''}" onclick="state.newEmployeur.role='admin'; render();">Admin</div>
                                </div>
                            </div>
                            <button class="btn-submit btn-submit--success" onclick="createEmployeur();">Créer le compte</button>
                        </div>
                    </div>
                </div>
            `;
        }
    
        // ---- LANCEMENT ----
        init();
    </script>

</body>
</html>
